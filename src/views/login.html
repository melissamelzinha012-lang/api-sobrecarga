
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MinhaRotina</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

    <main class="auth-card">
        <p class="auth-brand">MinhaRotina</p>

        <h1>Boas-vindas!</h1>
        <p class="auth-intro">
            Entre na sua conta para organizar seus estudos e compromissos.
        </p>

        <div id="mensagem" class="mensagem"></div>

        <form id="form-login" class="auth-form">
            <div class="field">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">Entrar na minha conta</button>
        </form>

        <p class="auth-foot">
            Organize sua rotina com facilidade.
        </p>
    </main>

    <!-- Mantenha aqui o script de autenticação
         que já existe no seu projeto. -->

</body>
</html>
